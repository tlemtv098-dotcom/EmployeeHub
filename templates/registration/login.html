{% load static %}
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ | EmployeeHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-page">
<div class="login-card">
    <div class="login-brand"><div class="brand-mark">EH</div><h1>EmployeeHub</h1></div>
    <p class="login-subtitle">เข้าสู่ระบบจัดการพนักงาน</p>
    {% if messages %}
        {% for message in messages %}<div class="alert" style="background:#e6f4ea;color:#137333;border:1px solid #a8dab5">{{ message }}</div>{% endfor %}
    {% endif %}
    {% if form.errors %}<div class="alert">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>ชื่อผู้ใช้</label>
        <input type="text" name="username" autofocus required>
        <label>รหัสผ่าน</label>
        <input type="password" name="password" required>
        <button class="primary-btn full" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:14px">ยังไม่มีบัญชี? <a href="{% url 'signup' %}" style="color:#1a73e8;font-weight:500">สมัครสมาชิก</a></p>
</div>
</body>
</html>
