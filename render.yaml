services:
  - type: web
    name: employee-hub-kpru
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: employee-hub-db
          property: connectionString

databases:
  - name: employee-hub-db
    plan: free
